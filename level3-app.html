<!doctype html><html><head><meta charset="utf-8"><title>Ballistics</title></head><body><script>
(async()=>{

    let h=await fetch("app.html",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});
    h=h.replace(
      'terrainY=x=>L<2?T(x):444-40*M.exp(-(((x-110)/170)**2))-120*M.exp(-(((x-855)/150)**2))+40*M.exp(-(((x-480)/210)**2))+5*M.sin(x*.022)+3*M.sin(x*.051);',
      'let B=x=>444-40*M.exp(-(((x-110)/170)**2))-120*M.exp(-(((x-855)/150)**2))+40*M.exp(-(((x-480)/210)**2))+5*M.sin(x*.022)+3*M.sin(x*.051);terrainY=x=>L<2?T(x):L<3?B(x):B(x)-48*M.exp(-(((x-66)/20)**2))-48*M.exp(-(((x-150)/20)**2))+30*M.exp(-(((x-108)/32)**2))-48*M.exp(-(((x-810)/20)**2))-48*M.exp(-(((x-894)/20)**2))+30*M.exp(-(((x-852)/32)**2));'
    );

    document.open();document.write(h);document.close();
  }catch{location.replace("app.html")}
})();
</script></body></html>
