      'let B=x=>444-40*M.exp(-(((x-110)/170)**2))-120*M.exp(-(((x-855)/150)**2))+40*M.exp(-(((x-480)/210)**2))+5*M.sin(x*.022)+3*M.sin(x*.051),D=x=>B(x)-48*M.exp(-(((x-66)/20)**2))-48*M.exp(-(((x-150)/20)**2))+30*M.exp(-(((x-108)/32)**2))-48*M.exp(-(((x-810)/20)**2))-48*M.exp(-(((x-894)/20)**2))+30*M.exp(-(((x-852)/32)**2));terrainY=x=>L<2?T(x):L<3?B(x):L<6?D(x):B(x);'
    );

      'let R=renderBackdrop;renderBackdrop=()=>R();let S=document.querySelector(".stage-label"),N=newRound;',
      'let W={player:2,cpu:2},K={player:3,cpu:3},Q={player:3,cpu:3},CP=cannonPosition;cannonPosition=s=>{let p=CP(s);if(L==6)p.y-=58;return p};function BR(s,w=116){let x=s=="player"?108:852,y=M.min(terrainY(x-42),terrainY(x+42))-4;return{x,y,w}}function TR(s){let x=s=="player"?108:852,g=terrainY(x);return{x,ground:g,top:g-58,w:118,body:90}}function DB(s){let r=BR(s),n=W[s]||0;if(!n)return;bg.save();bg.lineWidth=2;for(let i=0;i<n;i++){let y=r.y-10-i*12;bg.fillStyle=i%2?"#78502d":"#684326";bg.strokeStyle="#352416";bg.beginPath();bg.roundRect(r.x-r.w/2,y,r.w,10,5);bg.fill();bg.stroke();bg.fillStyle="#a47745";bg.beginPath();bg.arc(r.x-r.w/2+5,y+5,3,0,M.PI*2);bg.arc(r.x+r.w/2-5,y+5,3,0,M.PI*2);bg.fill()}bg.restore()}function DS(s){let r=BR(s,120),n=K[s]||0;if(!n)return;bg.save();bg.lineWidth=1.5;for(let i=0;i<n;i++){let y=r.y-12-i*13,bw=30,start=r.x-r.w/2-(i%2?15:0);for(let x=start;x<r.x+r.w/2;x+=bw){let l=M.max(x,r.x-r.w/2),q=M.min(x+bw-1,r.x+r.w/2);if(q<=l)continue;bg.fillStyle=(i+x/bw)%2?"#777b79":"#686d6b";bg.strokeStyle="#343938";bg.fillRect(l,y,q-l,11);bg.strokeRect(l,y,q-l,11);bg.fillStyle="rgba(220,220,205,.18)";bg.fillRect(l+2,y+2,M.max(0,q-l-4),2)}}bg.restore()}function DT(s){let r=TR(s),n=Q[s]||0;bg.save();bg.lineWidth=1.5;bg.fillStyle="#606563";bg.strokeStyle="#303534";bg.beginPath();bg.moveTo(r.x-r.body/2,r.ground);bg.lineTo(r.x-r.body/2+5,r.top);bg.lineTo(r.x+r.body/2-5,r.top);bg.lineTo(r.x+r.body/2,r.ground);bg.closePath();bg.fill();bg.stroke();for(let y=r.top+12,row=0;y<r.ground;y+=12,row++){bg.strokeStyle="rgba(45,50,49,.75)";bg.beginPath();bg.moveTo(r.x-r.body/2+2,y);bg.lineTo(r.x+r.body/2-2,y);bg.stroke();let off=row%2?11:0;for(let x=r.x-r.body/2+18+off;x<r.x+r.body/2;x+=24){bg.beginPath();bg.moveTo(x,y-12);bg.lineTo(x,y);bg.stroke()}}bg.fillStyle="#4f5553";bg.fillRect(r.x-r.body/2-5,r.top-4,r.body+10,6);if(n){for(let i=0;i<n;i++){let y=r.top-12-i*13,bw=30,start=r.x-r.w/2-(i%2?15:0);for(let x=start;x<r.x+r.w/2;x+=bw){let l=M.max(x,r.x-r.w/2),q=M.min(x+bw-1,r.x+r.w/2);if(q<=l)continue;bg.fillStyle=(i+x/bw)%2?"#7d817f":"#696e6c";bg.strokeStyle="#343938";bg.fillRect(l,y,q-l,11);bg.strokeRect(l,y,q-l,11);bg.fillStyle="rgba(225,225,210,.18)";bg.fillRect(l+2,y+2,M.max(0,q-l-4),2)}}if(n==3){let y=r.top-12-n*13;bg.fillStyle="#737876";bg.strokeStyle="#343938";for(let x of [r.x-r.w/2,r.x-14,r.x+r.w/2-28]){bg.fillRect(x,y,28,12);bg.strokeRect(x,y,28,12)}}}bg.restore()}let R=renderBackdrop;renderBackdrop=()=>{R();if(L==4){DB("player");DB("cpu")}else if(L==5){DS("player");DS("cpu")}else if(L==6){DT("player");DT("cpu")}};let U=updateProjectile;updateProjectile=dt=>{let p=state.projectile;if((L==4||L==5||L==6)&&p){let s=p.owner=="player"?"cpu":"player",H=L==4?W:L==5?K:Q,n=H[s]||0;if(n){let nv=p.vy+WORLD.gravity*dt,nx=p.x+(p.vx+state.wind*4*dt)*dt,ny=p.y+nv*dt,r=L==6?TR(s):BR(s,L==4?116:120),gap=L==4?12:13,yy0=L==4?r.y-5:L==5?r.y-6:r.top-7;for(let j=0;j<n;j++){let yy=yy0-j*gap,a=p.y-yy,b=ny-yy;if(a*b<=0&&ny!=p.y){let t=(yy-p.y)/(ny-p.y),ix=p.x+(nx-p.x)*t;if(ix>=r.x-r.w/2&&ix<=r.x+r.w/2){H[s]--;let stone=L>4;for(let i=0;i<(L==6?28:stone?24:18);i++)addParticle({kind:"debris",x:ix,y:yy,vx:(M.random()-.5)*(stone?150:190),vy:-35-M.random()*(stone?105:130),radius:(stone?3:2)+M.random()*(stone?5:4),life:.55+M.random()*.65,gravity:280,drag:.99,rotation:M.random()*M.PI,spin:(M.random()-.5)*12,color:stone?(M.random()>.5?"112,116,114":"79,84,82"):(M.random()>.5?"122,78,36":"78,48,25")});renderBackdrop();let msg=L==6?(H[s]==2?"Parapet struck.":H[s]==1?"Upper wall collapsing.":"Tower defenses breached!"):L==5?(H[s]==2?"Stone cracked.":H[s]==1?"Masonry collapsing.":"Bunker breached!"):(H[s]?"Timber struck.":"Barrier shattered!");continueAfterImpact(msg,720);return}}}}}U(dt)};let S=document.querySelector(".stage-label"),N=newRound;'
    );

    h=h.replace(
      'let W={player:2,cpu:2},K={player:3,cpu:3},Q={player:3,cpu:3},CP=cannonPosition;cannonPosition=s=>{let p=CP(s);if(L==6)p.y-=58;return p};',
      'let W={player:2,cpu:2},K={player:3,cpu:3},Q={player:3,cpu:3},CP=cannonPosition;function T7(s){let x=s=="player"?108:852,g=terrainY(x);return{x,ground:g,top:g-150,w:120,body:96}}cannonPosition=s=>{let p=CP(s);if(L==6)p.y-=58;else if(L==7)p.y=T7(s).top-15;return p};'
    );
    h=h.replace(
      'let R=renderBackdrop;',
      'function D7(s){let r=T7(s),d=s=="player"?1:-1;bg.save();bg.lineWidth=1.5;bg.fillStyle="#606563";bg.strokeStyle="#303534";bg.fillRect(r.x-r.body/2,r.top,r.body,r.ground-r.top);bg.strokeRect(r.x-r.body/2,r.top,r.body,r.ground-r.top);for(let y=r.top+12,row=0;y<r.ground;y+=12,row++){bg.strokeStyle="rgba(45,50,49,.78)";bg.beginPath();bg.moveTo(r.x-r.body/2+1,y);bg.lineTo(r.x+r.body/2-1,y);bg.stroke();let off=row%2?11:0;for(let x=r.x-r.body/2+18+off;x<r.x+r.body/2;x+=24){bg.beginPath();bg.moveTo(x,y-12);bg.lineTo(x,y);bg.stroke()}}for(let f=0;f<2;f++){let cy=f?r.ground-94:r.ground-40,hx=r.x+d*34;bg.fillStyle="#121719";bg.strokeStyle="#292e2d";bg.lineWidth=3;bg.fillRect(hx-20,cy-15,40,30);bg.strokeRect(hx-20,cy-15,40,30);bg.fillStyle="rgba(230,230,215,.12)";bg.fillRect(hx-16,cy-11,32,3)}bg.fillStyle="#4f5553";bg.strokeStyle="#303534";bg.lineWidth=1.5;bg.fillRect(r.x-r.body/2-5,r.top-4,r.body+10,6);bg.strokeRect(r.x-r.body/2-5,r.top-4,r.body+10,6);for(let i=0;i<3;i++){let y=r.top-12-i*13,bw=30,start=r.x-r.w/2-(i%2?15:0);for(let x=start;x<r.x+r.w/2;x+=bw){let l=M.max(x,r.x-r.w/2),q=M.min(x+bw-1,r.x+r.w/2);if(q<=l)continue;bg.fillStyle=(i+x/bw)%2?"#7d817f":"#696e6c";bg.strokeStyle="#343938";bg.fillRect(l,y,q-l,11);bg.strokeRect(l,y,q-l,11)}}let y=r.top-51;bg.fillStyle="#737876";for(let x of [r.x-r.w/2,r.x-14,r.x+r.w/2-28])bg.fillRect(x,y,28,12);bg.restore()}let R=renderBackdrop;'
    );
    h=h.replace(
      'else if(L==6){DT("player");DT("cpu")}};',
      'else if(L==6){DT("player");DT("cpu")}else if(L==7){D7("player");D7("cpu")}};'
    );
    h=h.replace('newRound=()=>{if(state.winner=="player"&&L==7)L=1;N();','newRound=()=>{if(state.winner=="player"&&L==7)L=1;if(L==4)W={player:2,cpu:2};if(L==5)K={player:3,cpu:3};if(L==6)Q={player:3,cpu:3};N();');
    document.open();document.write(h);document.close();
  }catch(e){console.error(e);location.replace("app.html")}
})();
</script></body></html>
