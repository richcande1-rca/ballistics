<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ballistics</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#151817}
    #app{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#151817}
  </style>
</head>
<body>
  <iframe id="app" src="level3-app.html?v=5" title="Ballistics artillery game" scrolling="no"></iframe>
  <script>
    (()=>{
      const frame=document.getElementById("app");
      const baseWidth=1000;
      const baseHeight=820;
      let skipRestart=false;
      let introTimer=null;

      function fit(){
        const scale=Math.min(1,innerWidth/baseWidth,innerHeight/baseHeight);
        frame.style.width=(innerWidth/scale)+"px";
        frame.style.height=(innerHeight/scale)+"px";
        frame.style.transform=`scale(${scale})`;
      }

      function addLevelSelector(game){
        if(game.getElementById("temporary-level-selector"))return;
        const stage=game.querySelector(".stage-label");
        if(!stage)return;

        const wrap=game.createElement("label");
        wrap.id="temporary-level-selector";
        wrap.textContent="LEVEL ";
        wrap.style.marginLeft="14px";
        wrap.style.font="700 12px system-ui";
        wrap.style.letterSpacing=".08em";

        const select=game.createElement("select");
        select.style.marginLeft="5px";
        select.style.padding="3px 7px";
        select.style.borderRadius="6px";
        select.style.background="#18253a";
        select.style.color="#fff";
        select.style.border="1px solid #607089";
        select.setAttribute("aria-label","Temporary level selector");

        const names=["Open Hills","High Ground","Trenches","Timber Defenses","Stone Defenses","Stone Tower"];
        names.forEach((name,i)=>{
          const option=game.createElement("option");
          option.value=String(i+1);
          option.textContent=`${i+1} · ${name}`;
          select.appendChild(option);
        });

        const current=Number(new URL(frame.src,location.href).searchParams.get("level"))||1;
        select.value=String(current);
        select.addEventListener("change",()=>{
          skipRestart=true;
          frame.src=`level3-app.html?v=5&level=${select.value}`;
        });

        wrap.appendChild(select);
        stage.after(wrap);
      }

      function addPrecisionButtons(){
        const outer=frame.contentDocument;
        const gameFrame=outer&&outer.querySelector("#g");
        const game=gameFrame&&gameFrame.contentDocument;
        if(!game)return false;

        addLevelSelector(game);

        if(!game.getElementById("precision-button-style")){
          const style=game.createElement("style");
          style.id="precision-button-style";
          style.textContent=`
            .precision-row{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:7px;align-items:center}
            .precision-row input[type="range"]{min-width:0}
            .precision-step{min-height:30px;height:30px;padding:0;border-radius:8px;font-size:1.2rem;line-height:1;letter-spacing:0}
          `;
          game.head.appendChild(style);
        }

        for(const id of ["angle","power"]){
          const slider=game.getElementById(id);
          if(!slider||slider.parentElement.classList.contains("precision-row"))continue;

          const row=game.createElement("div");
          row.className="precision-row";
          const minus=game.createElement("button");
          const plus=game.createElement("button");
          minus.type=plus.type="button";
          minus.className=plus.className="precision-step";
          minus.textContent="−";
          plus.textContent="+";
          minus.setAttribute("aria-label",`Decrease ${id}`);
          plus.setAttribute("aria-label",`Increase ${id}`);

          slider.before(row);
          row.append(minus,slider,plus);

          const step=direction=>{
            const amount=Number(slider.step)||1;
            const min=Number(slider.min);
            const max=Number(slider.max);
            slider.value=Math.max(min,Math.min(max,Number(slider.value)+direction*amount));
            slider.dispatchEvent(new Event("input",{bubbles:true}));
            slider.focus();
          };
          minus.addEventListener("click",()=>step(-1));
          plus.addEventListener("click",()=>step(1));
        }
        return true;
      }

      function watchGame(){
        const outer=frame.contentDocument;
        const gameFrame=outer&&outer.querySelector("#g");
        if(!gameFrame){setTimeout(watchGame,100);return}
        gameFrame.addEventListener("load",()=>setTimeout(addPrecisionButtons,0));
        if(!addPrecisionButtons())setTimeout(watchGame,100);
      }

      frame.addEventListener("load",()=>{
        const d=frame.contentDocument;
        const begin=d&&d.getElementById("begin");
        const open=d&&d.getElementById("open");
        const card=d&&d.getElementById("card");

        if(skipRestart&&begin&&open){
          const w=frame.contentWindow;
          const RealAudio=w.Audio;
          w.Audio=function(src){
            const audio=new RealAudio(src);
            const realPlay=audio.play.bind(audio);
            let firstPlay=true;
            audio.play=()=>{
              if(firstPlay){firstPlay=false;return Promise.resolve()}
              return realPlay();
            };
            return audio;
          };
          begin.click();
          w.Audio=RealAudio;
          open.hidden=true;
          skipRestart=false;
          watchGame();
          return;
        }

        if(begin&&open&&card){
          const skip=d.createElement("button");
          skip.type="button";
          skip.textContent="SKIP INTRO";
          skip.hidden=true;
          skip.style.marginLeft="10px";
          card.appendChild(skip);

          begin.addEventListener("click",()=>{
            open.hidden=false;
            begin.disabled=true;
            begin.textContent="OPENING FIRE...";
            skip.hidden=false;
            introTimer=setTimeout(()=>{open.hidden=true},16400);
          });

          skip.addEventListener("click",()=>{
            clearTimeout(introTimer);
            skipRestart=true;
            frame.src=frame.src;
          });
        }
        watchGame();
      });

      addEventListener("resize",fit,{passive:true});
      fit();
    })();
  </script>
</body>
</html>
