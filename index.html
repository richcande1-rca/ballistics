<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <title>Ballistics</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: #172033;
      --text: #f5f7fb;
      --muted: #b9c2d3;
      --accent: #f1b84b;
      --border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e1422;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .game-shell {
      width: min(100%, 1000px);
      display: grid;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 0 4px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      letter-spacing: 0.16em;
    }

    .stage-label {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: right;
    }

    .canvas-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #8fc8ec;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      touch-action: none;
    }

    .status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(12, 18, 30, 0.78);
      color: #fff;
      text-align: center;
      font-weight: 700;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
      gap: 12px;
      align-items: end;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .control {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    output {
      color: var(--text);
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      padding: 0 24px;
      background: var(--accent);
      color: #241707;
      font: inherit;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .readout {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .wind {
      color: var(--text);
      font-weight: 800;
    }

    @media (max-width: 680px) {
      body { padding: 8px; }
      .controls { grid-template-columns: 1fr 1fr; }
      button { grid-column: 1 / -1; width: 100%; }
      .readout { font-size: 0.84rem; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Ballistics artillery game">
    <div class="topbar">
      <h1>BALLISTICS</h1>
      <div class="stage-label">Stage 1 · Open Hills</div>
    </div>

    <section class="canvas-wrap">
      <canvas id="game" width="960" height="540" aria-label="Two cannons facing each other across a valley"></canvas>
      <div id="status" class="status" aria-live="polite">Your turn</div>
    </section>

    <section class="controls" aria-label="Cannon controls">
      <label class="control" for="angle">
        <span class="control-head"><span>ANGLE</span><output id="angleValue">45°</output></span>
        <input id="angle" type="range" min="10" max="80" value="45" step="1">
      </label>

      <label class="control" for="power">
        <span class="control-head"><span>POWER</span><output id="powerValue">70</output></span>
        <input id="power" type="range" min="30" max="100" value="70" step="1">
      </label>

      <button id="fire" type="button">FIRE</button>
    </section>

    <div class="readout">
      <span id="wind" class="wind">Wind: calm</span>
      <span>Destroy the enemy cannon.</span>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const angleInput = document.getElementById("angle");
      const powerInput = document.getElementById("power");
      const angleValue = document.getElementById("angleValue");
      const powerValue = document.getElementById("powerValue");
      const fireButton = document.getElementById("fire");
      const statusEl = document.getElementById("status");
      const windEl = document.getElementById("wind");

      const WORLD = { width: 960, height: 540, gravity: 170, speedScale: 3.6 };
      const cannons = {
        player: {
          x: 108,
          barrel: "#303940",
          barrelLight: "#667078",
          wood: "#7a4b27",
          woodLight: "#b0783e"
        },
        cpu: {
          x: 852,
          barrel: "#572d2a",
          barrelLight: "#9b5950",
          wood: "#684323",
          woodLight: "#a9753d"
        }
      };

      const state = {
        turn: "player",
        projectile: null,
        winner: null,
        wind: 0,
        lastTime: 0,
        cpuTimer: null,
        cpuAngle: 45
      };

      function terrainY(x) {
        const leftHill = 78 * Math.exp(-Math.pow((x - 105) / 185, 2));
        const rightHill = 78 * Math.exp(-Math.pow((x - 855) / 185, 2));
        const valley = 18 * Math.exp(-Math.pow((x - 480) / 240, 2));
        return 430 - leftHill - rightHill + valley;
      }

      function cannonPosition(side) {
        const cannon = cannons[side];
        return { x: cannon.x, y: terrainY(cannon.x) - 15 };
      }

      function randomWind() {
        const raw = Math.round((Math.random() * 16 - 8) * 2) / 2;
        return Math.abs(raw) < 1 ? 0 : raw;
      }

      function setWind(value) {
        state.wind = value;
        if (value === 0) {
          windEl.textContent = "Wind: calm";
          return;
        }
        const arrow = value > 0 ? "→" : "←";
        windEl.textContent = `Wind: ${arrow} ${Math.abs(value).toFixed(1)}`;
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function setControlsEnabled(enabled) {
        angleInput.disabled = !enabled;
        powerInput.disabled = !enabled;
        fireButton.disabled = !enabled;
      }

      function updateReadouts() {
        angleValue.textContent = `${angleInput.value}°`;
        powerValue.textContent = powerInput.value;
      }

      function barrelTip(side, angleDegrees) {
        const pos = cannonPosition(side);
        const direction = side === "player" ? 1 : -1;
        const radians = angleDegrees * Math.PI / 180;
        return {
          x: pos.x + Math.cos(radians) * 48 * direction,
          y: pos.y - 15 - Math.sin(radians) * 48
        };
      }

      function fire(side, angleDegrees, power) {
        if (state.projectile || state.winner) return;

        const origin = barrelTip(side, angleDegrees);
        const direction = side === "player" ? 1 : -1;
        const radians = angleDegrees * Math.PI / 180;
        const speed = power * WORLD.speedScale;

        state.projectile = {
          owner: side,
          x: origin.x,
          y: origin.y,
          vx: Math.cos(radians) * speed * direction,
          vy: -Math.sin(radians) * speed,
          trail: []
        };

        setControlsEnabled(false);
        setStatus(side === "player" ? "Shot away…" : "Enemy fires…");
      }

      function targetHit(projectile) {
        const targetSide = projectile.owner === "player" ? "cpu" : "player";
        const target = cannonPosition(targetSide);
        const dx = projectile.x - target.x;
        const dy = projectile.y - (target.y - 8);
        return Math.hypot(dx, dy) <= 27;
      }

      function finishShot(message) {
        state.projectile = null;

        if (state.turn === "player") {
          state.turn = "cpu";
          setStatus(message || "Enemy is aiming…");
          state.cpuTimer = window.setTimeout(cpuTurn, 850);
        } else {
          state.turn = "player";
          setStatus(message || "Your turn");
          setControlsEnabled(true);
        }
      }

      function endRound(winner) {
        state.winner = winner;
        state.projectile = null;
        setControlsEnabled(false);
        setStatus(winner === "player" ? "Direct hit — you win!" : "Direct hit — CPU wins");
        fireButton.disabled = false;
        fireButton.textContent = "NEW ROUND";
      }

      function cpuTurn() {
        state.cpuTimer = null;
        if (state.winner) return;

        const cpu = cannonPosition("cpu");
        const player = cannonPosition("player");
        const distance = Math.abs(cpu.x - player.x);
        const angle = 38 + Math.random() * 18;
        const radians = angle * Math.PI / 180;
        const idealSpeed = Math.sqrt((distance * WORLD.gravity) / Math.max(0.2, Math.sin(2 * radians)));
        const windCorrection = state.wind * 0.7;
        const error = 0.93 + Math.random() * 0.14;
        const power = Math.max(30, Math.min(100, ((idealSpeed + windCorrection) / WORLD.speedScale) * error));

        state.cpuAngle = angle;
        fire("cpu", angle, power);
      }

      function updateProjectile(dt) {
        const p = state.projectile;
        if (!p) return;

        p.vx += state.wind * 4 * dt;
        p.vy += WORLD.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 30) p.trail.shift();

        if (targetHit(p)) {
          endRound(p.owner);
          return;
        }

        const outOfBounds = p.x < -30 || p.x > WORLD.width + 30 || p.y > WORLD.height + 30;
        const hitGround = p.x >= 0 && p.x <= WORLD.width && p.y >= terrainY(p.x);

        if (outOfBounds) {
          finishShot("Long shot…");
        } else if (hitGround) {
          finishShot("Impact.");
        }
      }

      function drawSky() {
        const gradient = ctx.createLinearGradient(0, 0, 0, WORLD.height);
        gradient.addColorStop(0, "#5f9fd0");
        gradient.addColorStop(0.48, "#b9d9e8");
        gradient.addColorStop(0.78, "#f4ddb0");
        gradient.addColorStop(1, "#d8c183");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, WORLD.width, WORLD.height);

        const sunGlow = ctx.createRadialGradient(765, 92, 8, 765, 92, 78);
        sunGlow.addColorStop(0, "rgba(255,248,205,0.95)");
        sunGlow.addColorStop(0.28, "rgba(255,229,151,0.48)");
        sunGlow.addColorStop(1, "rgba(255,229,151,0)");
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(765, 92, 78, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,249,218,0.9)";
        ctx.beginPath();
        ctx.arc(765, 92, 24, 0, Math.PI * 2);
        ctx.fill();

        drawCloud(178, 92, 0.95, 0.58);
        drawCloud(510, 126, 0.72, 0.42);
        drawCloud(842, 178, 0.62, 0.34);
        drawBirds();
      }

      function drawCloud(x, y, scale, opacity) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = `rgba(255,255,245,${opacity})`;
        ctx.beginPath();
        ctx.arc(-31, 7, 18, 0, Math.PI * 2);
        ctx.arc(-8, -3, 25, 0, Math.PI * 2);
        ctx.arc(20, 6, 20, 0, Math.PI * 2);
        ctx.arc(40, 11, 13, 0, Math.PI * 2);
        ctx.rect(-31, 7, 71, 19);
        ctx.fill();
        ctx.restore();
      }

      function drawBirds() {
        ctx.strokeStyle = "rgba(48,70,78,0.55)";
        ctx.lineWidth = 1.6;
        ctx.lineCap = "round";
        [[330, 112, 7], [354, 128, 5], [610, 82, 6], [633, 96, 4]].forEach(([x, y, size]) => {
          ctx.beginPath();
          ctx.arc(x - size / 2, y, size / 2, Math.PI * 1.08, Math.PI * 1.92);
          ctx.arc(x + size / 2, y, size / 2, Math.PI * 1.08, Math.PI * 1.92);
          ctx.stroke();
        });
      }

      function drawMountains() {
        ctx.fillStyle = "#9eb6bd";
        ctx.beginPath();
        ctx.moveTo(0, 312);
        ctx.lineTo(92, 224);
        ctx.lineTo(150, 274);
        ctx.lineTo(242, 174);
        ctx.lineTo(318, 267);
        ctx.lineTo(405, 206);
        ctx.lineTo(492, 287);
        ctx.lineTo(596, 166);
        ctx.lineTo(680, 269);
        ctx.lineTo(775, 205);
        ctx.lineTo(872, 282);
        ctx.lineTo(960, 225);
        ctx.lineTo(960, 380);
        ctx.lineTo(0, 380);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(240,245,239,0.82)";
        ctx.beginPath();
        ctx.moveTo(206, 214);
        ctx.lineTo(242, 174);
        ctx.lineTo(276, 216);
        ctx.lineTo(260, 207);
        ctx.lineTo(246, 220);
        ctx.lineTo(231, 205);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(552, 217);
        ctx.lineTo(596, 166);
        ctx.lineTo(637, 217);
        ctx.lineTo(616, 205);
        ctx.lineTo(599, 221);
        ctx.lineTo(581, 203);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(111,139,145,0.54)";
        ctx.beginPath();
        ctx.moveTo(0, 341);
        ctx.quadraticCurveTo(125, 247, 252, 340);
        ctx.quadraticCurveTo(380, 251, 520, 342);
        ctx.quadraticCurveTo(676, 238, 810, 341);
        ctx.quadraticCurveTo(892, 282, 960, 326);
        ctx.lineTo(960, 405);
        ctx.lineTo(0, 405);
        ctx.closePath();
        ctx.fill();
      }

      function drawPastoralValley() {
        const meadow = ctx.createLinearGradient(0, 292, 0, 452);
        meadow.addColorStop(0, "#9db578");
        meadow.addColorStop(1, "#68875d");
        ctx.fillStyle = meadow;
        ctx.beginPath();
        ctx.moveTo(0, 333);
        ctx.quadraticCurveTo(170, 287, 325, 351);
        ctx.quadraticCurveTo(476, 399, 636, 335);
        ctx.quadraticCurveTo(805, 282, 960, 342);
        ctx.lineTo(960, 468);
        ctx.lineTo(0, 468);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(127,173,188,0.78)";
        ctx.beginPath();
        ctx.moveTo(448, 351);
        ctx.bezierCurveTo(493, 363, 527, 376, 519, 395);
        ctx.bezierCurveTo(511, 414, 565, 429, 626, 447);
        ctx.lineTo(567, 456);
        ctx.bezierCurveTo(512, 432, 477, 412, 488, 392);
        ctx.bezierCurveTo(497, 376, 466, 365, 420, 356);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(231,242,228,0.55)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(452, 354);
        ctx.bezierCurveTo(497, 367, 527, 379, 520, 396);
        ctx.stroke();

        drawVillage();
        drawTreeLine();
      }

      function drawVillage() {
        const houses = [
          [365, 338, 17, 12, "#d8c59c", "#7f4933"],
          [391, 344, 14, 10, "#cbb88b", "#72402f"],
          [650, 329, 18, 13, "#d8c59c", "#774331"],
          [677, 338, 15, 11, "#c7b384", "#693b2f"]
        ];

        houses.forEach(([x, y, w, h, wall, roof]) => {
          ctx.fillStyle = wall;
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = roof;
          ctx.beginPath();
          ctx.moveTo(x - 3, y);
          ctx.lineTo(x + w / 2, y - 8);
          ctx.lineTo(x + w + 3, y);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(50,49,42,0.6)";
          ctx.fillRect(x + w * 0.43, y + h * 0.45, 3, h * 0.55);
        });

        ctx.fillStyle = "#d7c596";
        ctx.fillRect(628, 316, 9, 25);
        ctx.fillStyle = "#6e3f31";
        ctx.beginPath();
        ctx.moveTo(624, 316);
        ctx.lineTo(632.5, 303);
        ctx.lineTo(641, 316);
        ctx.closePath();
        ctx.fill();
      }

      function drawTreeLine() {
        const trees = [
          [286, 349, 13], [309, 356, 10], [334, 346, 15],
          [703, 347, 13], [731, 340, 16], [756, 351, 11]
        ];

        trees.forEach(([x, y, size]) => {
          ctx.fillStyle = "#4e6749";
          ctx.beginPath();
          ctx.arc(x, y - size * 0.55, size * 0.62, 0, Math.PI * 2);
          ctx.arc(x - size * 0.42, y - size * 0.28, size * 0.48, 0, Math.PI * 2);
          ctx.arc(x + size * 0.42, y - size * 0.28, size * 0.48, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#574630";
          ctx.fillRect(x - 1.5, y - 4, 3, 8);
        });
      }

      function drawTerrain() {
        const ground = ctx.createLinearGradient(0, 330, 0, 540);
        ground.addColorStop(0, "#547f45");
        ground.addColorStop(0.36, "#3d673a");
        ground.addColorStop(1, "#213d2b");
        ctx.fillStyle = ground;
        ctx.beginPath();
        ctx.moveTo(0, terrainY(0));
        for (let x = 0; x <= WORLD.width; x += 5) {
          ctx.lineTo(x, terrainY(x));
        }
        ctx.lineTo(WORLD.width, WORLD.height);
        ctx.lineTo(0, WORLD.height);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#8daf61";
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let x = 0; x <= WORLD.width; x += 5) {
          const y = terrainY(x);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        drawForegroundDetails();
      }

      function drawForegroundDetails() {
        ctx.strokeStyle = "rgba(156,190,98,0.75)";
        ctx.lineWidth = 1.4;
        const grassTufts = [48, 172, 236, 704, 785, 916];
        grassTufts.forEach((x, index) => {
          const y = terrainY(x) + 4 + (index % 2) * 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 5, y - 11);
          ctx.moveTo(x, y);
          ctx.lineTo(x + 1, y - 14);
          ctx.moveTo(x, y);
          ctx.lineTo(x + 6, y - 9);
          ctx.stroke();
        });

        ctx.fillStyle = "rgba(46,57,45,0.38)";
        [[190, 6], [744, 7], [905, 5]].forEach(([x, r]) => {
          ctx.beginPath();
          ctx.ellipse(x, terrainY(x) - 1, r * 1.5, r, -0.18, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawWheel(x, y, radius, colors) {
        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = "rgba(26,23,19,0.3)";
        ctx.beginPath();
        ctx.arc(2, 2, radius + 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = colors.wood;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = colors.woodLight;
        ctx.lineWidth = 2.2;
        for (let i = 0; i < 10; i += 1) {
          const angle = i * Math.PI / 5;
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle) * 3, Math.sin(angle) * 3);
          ctx.lineTo(Math.cos(angle) * (radius - 3), Math.sin(angle) * (radius - 3));
          ctx.stroke();
        }

        ctx.fillStyle = colors.barrel;
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCannon(side) {
        const cannon = cannons[side];
        const pos = cannonPosition(side);
        const angle = side === "player" ? Number(angleInput.value) : state.cpuAngle;
        const direction = side === "player" ? 1 : -1;
        const radians = angle * Math.PI / 180;

        ctx.save();
        ctx.translate(pos.x, pos.y);

        ctx.fillStyle = "rgba(20,28,22,0.35)";
        ctx.beginPath();
        ctx.ellipse(-4 * direction, 16, 32, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.scale(direction, 1);

        ctx.fillStyle = cannon.wood;
        ctx.beginPath();
        ctx.moveTo(-33, 4);
        ctx.lineTo(-5, -9);
        ctx.lineTo(18, -7);
        ctx.lineTo(13, 5);
        ctx.lineTo(-28, 10);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = cannon.woodLight;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-29, 5);
        ctx.lineTo(13, -3);
        ctx.stroke();

        drawWheel(-7, 3, 16, cannon);

        ctx.fillStyle = cannon.barrel;
        ctx.beginPath();
        ctx.arc(0, -13, 6.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(0, -15);
        ctx.rotate(-radians);

        const barrelGradient = ctx.createLinearGradient(0, -7, 0, 7);
        barrelGradient.addColorStop(0, cannon.barrelLight);
        barrelGradient.addColorStop(0.4, cannon.barrel);
        barrelGradient.addColorStop(1, "#1d2326");
        ctx.fillStyle = barrelGradient;
        ctx.beginPath();
        ctx.moveTo(-12, -7);
        ctx.lineTo(38, -4.8);
        ctx.lineTo(48, -5.8);
        ctx.lineTo(48, 5.8);
        ctx.lineTo(38, 4.8);
        ctx.lineTo(-12, 7);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = cannon.barrel;
        ctx.fillRect(38, -7.4, 10, 14.8);
        ctx.fillStyle = cannon.barrelLight;
        ctx.fillRect(40, -5.4, 2, 10.8);

        ctx.fillStyle = cannon.barrel;
        ctx.beginPath();
        ctx.arc(-13, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-21, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(220,229,224,0.26)";
        ctx.fillRect(4, -4.4, 27, 1.6);
        ctx.restore();

        ctx.fillStyle = cannon.barrel;
        ctx.beginPath();
        ctx.arc(0, -13, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawProjectile() {
        const p = state.projectile;
        if (!p) return;

        if (p.trail.length > 1) {
          ctx.strokeStyle = "rgba(70, 68, 62, 0.35)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          p.trail.forEach((point, index) => {
            if (index === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
          });
          ctx.stroke();
        }

        ctx.fillStyle = "#252629";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw() {
        drawSky();
        drawMountains();
        drawPastoralValley();
        drawTerrain();
        drawCannon("player");
        drawCannon("cpu");
        drawProjectile();
      }

      function frame(timestamp) {
        const dt = Math.min(0.033, (timestamp - state.lastTime) / 1000 || 0);
        state.lastTime = timestamp;
        updateProjectile(dt);
        draw();
        window.requestAnimationFrame(frame);
      }

      function newRound() {
        if (state.cpuTimer) window.clearTimeout(state.cpuTimer);
        state.turn = "player";
        state.projectile = null;
        state.winner = null;
        state.cpuAngle = 45;
        fireButton.textContent = "FIRE";
        angleInput.value = "45";
        powerInput.value = "70";
        updateReadouts();
        setWind(randomWind());
        setStatus("Your turn");
        setControlsEnabled(true);
      }

      angleInput.addEventListener("input", updateReadouts);
      powerInput.addEventListener("input", updateReadouts);
      fireButton.addEventListener("click", () => {
        if (state.winner) {
          newRound();
          return;
        }
        if (state.turn !== "player" || state.projectile) return;
        fire("player", Number(angleInput.value), Number(powerInput.value));
      });

      newRound();
      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
