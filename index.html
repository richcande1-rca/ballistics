<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#151817">
  <title>Ballistics</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#151817;touch-action:none}
    body{-webkit-user-select:none;user-select:none}
    #app{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#151817}
    #rotate{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));background:#151817;color:#efe6ca;text-align:center;font-family:system-ui,sans-serif}
    #rotate .card{max-width:340px}
    #rotate .phone{width:74px;height:124px;margin:0 auto 24px;border:5px solid #d8bd76;border-radius:13px;transform:rotate(90deg);position:relative}
    #rotate .phone:after{content:"";position:absolute;width:24px;height:4px;left:20px;bottom:7px;border-radius:4px;background:#d8bd76}
    #rotate strong{display:block;font:900 1.35rem Georgia,serif;letter-spacing:.08em}
    #rotate span{display:block;margin-top:10px;color:#bdb59f;font-weight:700;letter-spacing:.08em}
    @media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
  </style>
</head>
<body>
  <iframe id="app" src="level8-app.html?v=17" title="Ballistics artillery game" scrolling="no" allow="fullscreen"></iframe>
  <div id="rotate" role="status" aria-live="polite"><div class="card"><div class="phone" aria-hidden="true"></div><strong>ROTATE TO LANDSCAPE</strong><span>Turn your phone sideways to play Ballistics.</span></div></div>
  <script>
    (()=>{
      const frame=document.getElementById("app");
      const baseWidth=1000;
      const baseHeight=820;
      let skipRestart=false;
      let introTimer=null;

      function isLandscapePhone(){return matchMedia("(pointer:coarse)").matches&&innerWidth>innerHeight}
      function fit(){
        const scale=Math.min(1,innerWidth/baseWidth,innerHeight/baseHeight);
        frame.style.width=(innerWidth/scale)+"px";
        frame.style.height=(innerHeight/scale)+"px";
        frame.style.transform=`scale(${scale})`;
      }

      async function enterMobileFullscreen(){
        if(!isLandscapePhone())return;
        try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.()}catch(_){ }
        try{await screen.orientation?.lock?.("landscape")}catch(_){ }
      }

      function limitThemeToOpening(){
        const w=frame.contentWindow;
        if(!w||w.__ballisticsThemeLimited)return;
        const RealAudio=w.Audio;
        let themePlayed=false;
        w.Audio=function(src){
          const audio=new RealAudio(src);
          const realPlay=audio.play.bind(audio);
          audio.play=()=>{
            const source=audio.currentSrc||audio.src||String(src||"");
            if(source.includes("original-pastoral-theme.mp3")){
              if(themePlayed)return Promise.resolve();
              themePlayed=true;
            }
            return realPlay();
          };
          return audio;
        };
        w.__ballisticsThemeLimited=true;
      }

      function addLevelSelector(game){
        if(game.getElementById("temporary-level-selector"))return;
        const stage=game.querySelector(".stage-label");
        if(!stage)return;
        const wrap=game.createElement("label");
        wrap.id="temporary-level-selector";
        wrap.textContent="LEVEL ";
        wrap.style.marginLeft="14px";
        wrap.style.font="700 12px system-ui";
        wrap.style.letterSpacing=".08em";
        const select=game.createElement("select");
        select.style.marginLeft="5px";
        select.style.padding="3px 7px";
        select.style.borderRadius="6px";
        select.style.background="#18253a";
        select.style.color="#fff";
        select.style.border="1px solid #607089";
        select.setAttribute("aria-label","Temporary level selector");
        const names=["Open Hills","High Ground","Trenches","Timber Defenses","Stone Defenses","Stone Tower","Three-Story Tower","Archer Siege"];
        names.forEach((name,i)=>{
          const option=game.createElement("option");
          option.value=String(i+1);
          option.textContent=`${i+1} · ${name}`;
          select.appendChild(option);
        });
        const current=Number(new URL(frame.src,location.href).searchParams.get("level"))||1;
        select.value=String(current);
        select.addEventListener("change",()=>{
          skipRestart=true;
          frame.src=`level8-app.html?v=17&level=${select.value}`;
        });
        wrap.appendChild(select);
        stage.after(wrap);
      }

      function addTowerMovement(game,gameFrame){
        if(game.getElementById("tower-movement-controls"))return;
        const stage=game.querySelector(".stage-label");
        const panel=game.querySelector(".controls");
        if(!stage||!panel)return;
        const controls=game.createElement("div");
        controls.id="tower-movement-controls";
        controls.style.display="none";
        controls.style.gridColumn="1 / -1";
        controls.style.alignItems="center";
        controls.style.justifyContent="center";
        controls.style.gap="8px";
        controls.style.font="700 12px system-ui";
        controls.style.letterSpacing=".06em";
        const down=game.createElement("button");
        const label=game.createElement("span");
        const up=game.createElement("button");
        down.type=up.type="button";
        down.textContent="▼ DOWN";
        up.textContent="▲ UP";
        label.textContent="TOP";
        label.style.minWidth="70px";
        label.style.textAlign="center";
        for(const button of [down,up]){
          button.style.padding="0 14px";
          button.style.minHeight="38px";
          button.style.fontSize="11px";
          button.style.letterSpacing=".06em";
        }
        let floor=2;
        const refresh=()=>{
          const selectedLevel=Number(new URL(frame.src,location.href).searchParams.get("level"))||1;
          const onTowerLevel=selectedLevel>=7||stage.textContent.includes("Three-Story Tower")||stage.textContent.includes("Archer Siege");
          controls.style.display=onTowerLevel?"flex":"none";
          label.textContent=["BOTTOM","MIDDLE","TOP"][floor];
          down.disabled=floor===0;
          up.disabled=floor===2;
        };
        down.addEventListener("click",()=>gameFrame.contentWindow.moveTower?.(-1));
        up.addEventListener("click",()=>gameFrame.contentWindow.moveTower?.(1));
        game.addEventListener("tower-floor-change",event=>{floor=event.detail.floor;refresh()});
        new MutationObserver(refresh).observe(stage,{childList:true,characterData:true,subtree:true});
        controls.append(down,label,up);
        panel.appendChild(controls);
        refresh();
      }

      function addMobileStyles(game){
        if(game.getElementById("mobile-landscape-style"))return;
        const style=game.createElement("style");
        style.id="mobile-landscape-style";
        style.textContent=`
          html,body{overscroll-behavior:none}
          input,button,select{touch-action:manipulation}
          @media (pointer:coarse) and (orientation:landscape){
            body{padding:2px 6px 4px;display:block;overflow:hidden}
            .game-shell{width:100%;height:100%;max-width:none;gap:3px;grid-template-rows:auto minmax(0,1fr) auto auto}
            .topbar{min-height:20px;padding:0 3px;align-items:center}
            h1{display:none}
            .stage-label{font-size:.68rem;text-align:left;white-space:nowrap}
            #temporary-level-selector{font-size:9px!important;margin-left:6px!important}
            #temporary-level-selector select{min-height:24px;padding:1px 4px!important}
            .canvas-wrap{min-height:0;border-radius:7px}
            canvas{height:100%;width:100%;object-fit:contain;aspect-ratio:auto}
            .status{top:4px;padding:4px 8px;font-size:.68rem}
            .controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 112px;gap:5px;padding:4px 6px;border-radius:7px;align-items:center}
            .control{gap:1px}
            .control-head{font-size:.66rem}
            .precision-row{grid-template-columns:36px minmax(0,1fr) 36px!important;gap:4px!important;min-height:38px}
            .precision-step{height:38px!important;min-height:38px!important;font-size:1.2rem!important}
            input[type=range]{height:38px;margin:0}
            input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
            .range-scale{display:none}
            #fire{height:42px;min-height:42px;padding:0 8px;font-size:.82rem}
            #tower-movement-controls{grid-column:1 / -1!important;height:36px;margin-top:-2px}
            #tower-movement-controls button{min-height:34px!important;min-width:82px;font-size:11px!important}
            .readout{font-size:.66rem;padding:0 3px;min-height:14px}
          }
        `;
        game.head.appendChild(style);
      }

      function addPrecisionButtons(){
        const outer=frame.contentDocument;
        const gameFrame=outer&&outer.querySelector("#g");
        const game=gameFrame&&gameFrame.contentDocument;
        if(!game)return false;
        addLevelSelector(game);
        addTowerMovement(game,gameFrame);
        addMobileStyles(game);
        if(!game.getElementById("precision-button-style")){
          const style=game.createElement("style");
          style.id="precision-button-style";
          style.textContent=`
            .precision-row{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:7px;align-items:center}
            .precision-row input[type="range"]{min-width:0}
            .precision-step{min-height:30px;height:30px;padding:0;border-radius:8px;font-size:1.2rem;line-height:1;letter-spacing:0}
          `;
          game.head.appendChild(style);
        }
        for(const id of ["angle","power"]){
          const slider=game.getElementById(id);
          if(!slider||slider.parentElement.classList.contains("precision-row"))continue;
          const row=game.createElement("div");
          row.className="precision-row";
          const minus=game.createElement("button");
          const plus=game.createElement("button");
          minus.type=plus.type="button";
          minus.className=plus.className="precision-step";
          minus.textContent="−";
          plus.textContent="+";
          minus.setAttribute("aria-label",`Decrease ${id}`);
          plus.setAttribute("aria-label",`Increase ${id}`);
          slider.before(row);
          row.append(minus,slider,plus);
          const step=direction=>{
            const amount=Number(slider.step)||1;
            const min=Number(slider.min);
            const max=Number(slider.max);
            slider.value=Math.max(min,Math.min(max,Number(slider.value)+direction*amount));
            slider.dispatchEvent(new Event("input",{bubbles:true}));
            slider.focus();
          };
          minus.addEventListener("click",()=>step(-1));
          plus.addEventListener("click",()=>step(1));
        }
        return true;
      }

      function watchGame(){
        const outer=frame.contentDocument;
        const gameFrame=outer&&outer.querySelector("#g");
        if(!gameFrame){setTimeout(watchGame,100);return}
        gameFrame.addEventListener("load",()=>setTimeout(addPrecisionButtons,0));
        if(!addPrecisionButtons())setTimeout(watchGame,100);
      }

      frame.addEventListener("load",()=>{
        limitThemeToOpening();
        const d=frame.contentDocument;
        const begin=d&&d.getElementById("begin");
        const open=d&&d.getElementById("open");
        const card=d&&d.getElementById("card");
        if(skipRestart&&begin&&open){
          const w=frame.contentWindow;
          const RealAudio=w.Audio;
          w.Audio=function(src){
            const audio=new RealAudio(src);
            const realPlay=audio.play.bind(audio);
            let firstPlay=true;
            audio.play=()=>{if(firstPlay){firstPlay=false;return Promise.resolve()}return realPlay()};
            return audio;
          };
          begin.click();
          w.Audio=RealAudio;
          open.hidden=true;
          skipRestart=false;
          watchGame();
          return;
        }
        if(begin&&open&&card){
          const skip=d.createElement("button");
          skip.type="button";
          skip.textContent="SKIP INTRO";
          skip.hidden=true;
          skip.style.marginLeft="10px";
          card.appendChild(skip);
          begin.addEventListener("click",()=>{
            enterMobileFullscreen();
            open.hidden=false;
            begin.disabled=true;
            begin.textContent="OPENING FIRE...";
            skip.hidden=false;
            introTimer=setTimeout(()=>{open.hidden=true},16400);
          });
          skip.addEventListener("click",()=>{
            clearTimeout(introTimer);
            skipRestart=true;
            frame.src=frame.src;
          });
        }
        watchGame();
      });

      addEventListener("resize",fit,{passive:true});
      addEventListener("orientationchange",()=>setTimeout(fit,150),{passive:true});
      document.addEventListener("contextmenu",event=>{if(matchMedia("(pointer:coarse)").matches)event.preventDefault()});
      fit();
    })();
  </script>
</body>
</html>
