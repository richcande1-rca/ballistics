<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballistics</title><style>
html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#151817}iframe{display:block}#open{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,16,15,.88);backdrop-filter:blur(3px)}#card{width:min(82vw,520px);padding:34px 28px 30px;text-align:center;color:#efe6ca;border:1px solid #d8bd76;background:#1b1f1c;box-shadow:0 24px 80px #0009}h1{margin:0;font:800 clamp(2.2rem,8vw,4.6rem)/.95 Georgia,serif;letter-spacing:.08em}p{margin:14px 0 26px;color:#bdb59f;font:700 .82rem system-ui;letter-spacing:.18em;text-transform:uppercase}button{padding:13px 30px;border:0;background:#d8bd76;color:#1b1c18;font:900 1rem system-ui;letter-spacing:.14em;cursor:pointer}#open[hidden]{display:none}
</style></head><body><iframe id="g" title="Ballistics artillery game"></iframe><div id="open"><div id="card"><h1>BALLISTICS</h1><p>Stage 1 · Open Hills</p><button id="begin">BEGIN</button></div></div><script>
(()=>{"use strict";const f=document.querySelector("#g"),o=document.querySelector("#open"),b=document.querySelector("#begin");let a,m,n,started=false,watch,last="";
async function load(){let h=await fetch("game.html",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const swaps=[[`max="100" value="70"`,`max="120" value="70"`],[`const windCorrection = state.wind * 0.7;`,`const windCorrection = state.wind * 4;`],[`Math.min(100, ((idealSpeed + windCorrection)`,`Math.min(120, ((idealSpeed + windCorrection)`]];for(const[x,y]of swaps){if(!h.includes(x))throw Error("wind patch mismatch");h=h.replace(x,y)}f.srcdoc=h}
load().catch(()=>{f.src="game.html"});
function init(){if(a)return a;const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;a=new A;m=a.createGain();m.gain.value=.72;m.connect(a.destination);n=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return a}
function tone(hz,t,len,vol,type="sine"){const x=a.createOscillator(),g=a.createGain();x.type=type;x.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+len);x.connect(g);g.connect(m);x.start(t);x.stop(t+len+.04)}
function noise(t,len,vol,cut){const s=a.createBufferSource(),q=a.createBiquadFilter(),g=a.createGain();s.buffer=n;q.type="lowpass";q.frequency.value=cut;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);s.connect(q);q.connect(g);g.connect(m);s.start(t);s.stop(t+len)}
function bird(t,hz){const x=a.createOscillator(),g=a.createGain();x.frequency.setValueAtTime(hz,t);x.frequency.exponentialRampToValueAtTime(hz*1.3,t+.09);x.frequency.exponentialRampToValueAtTime(hz*.9,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.21);x.connect(g);g.connect(m);x.start(t);x.stop(t+.23)}
function theme(){const t=a.currentTime+.08,beat=.58,mel=[[392,0,1.8],[523.25,2,.9],[493.88,3,.9],[440,4,1.8],[392,6,.9],[440,7,.9],[493.88,8,1.8],[392,10,1.8],[329.63,12,.9],[392,13,.9],[440,14,1.8],[392,16,2.6]];for(const[h,s,l]of mel){tone(h,t+s*beat,l*beat,.07,"triangle");tone(h/2,t+s*beat,l*beat,.025)}[1.3,2,4.7,5.3,7.7,8.2].forEach((s,i)=>bird(t+s,1950+i%3*270))}
function cannon(){if(!started)return;const t=a.currentTime;noise(t,.8,.46,900);tone(92,t,.72,.34);tone(48,t+.015,1.05,.28);tone(1500,t,.055,.12,"square")}
function impact(){if(!started)return;const t=a.currentTime;noise(t,.38,.22,520);tone(68,t,.42,.18)}
function hit(win){if(!started)return;const t=a.currentTime;noise(t,1.25,.62,1250);noise(t+.04,1.55,.34,430);tone(72,t,1.15,.42);tone(38,t+.03,1.55,.34);const notes=win?[392,493.88,587.33,783.99]:[392,369.99,329.63,261.63];notes.forEach((h,i)=>tone(h,t+.48+i*.18,i===3?.72:.3,.075,"triangle"))}
function status(s){if(!s||s===last)return;last=s;if(s==="Shot away…"||s==="Enemy fires…")cannon();else if(s==="Impact.")impact();else if(s.startsWith("Direct hit"))hit(s.includes("you win"))}
function connect(){if(watch)watch.disconnect();const d=f.contentDocument,e=d&&d.querySelector("#status");if(!e)return;last=e.textContent.trim();watch=new MutationObserver(()=>status(e.textContent.trim()));watch.observe(e,{childList:true,characterData:true,subtree:true})}
f.addEventListener("load",connect);b.addEventListener("click",async()=>{const c=init();if(c&&c.state==="suspended")await c.resume();started=!!c;o.hidden=true;if(c)theme();connect();f.contentWindow.focus()})})();
</script></body></html>
